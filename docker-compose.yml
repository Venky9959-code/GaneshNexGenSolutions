version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ganesh_bos_postgres
    environment:
      POSTGRES_DB: GaneshBOSDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ganesh_bos_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: src/GaneshBOS.Api/Dockerfile
    container_name: ganesh_bos_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=GaneshBOSDb;Username=postgres;Password=postgrespassword
    ports:
      - "5000:80"
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ganesh_bos_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
